# Candidato b: BodyWithFeet / modo balanced (RTMPose-m Halpe26 + YOLOX-m)
# T3 da Issue #9. Os thresholds sao arbitrarios; os valores reais vem da Issue #10.
# Mesmo schema de config/pose_config.yaml (validado por src/config.py).

input:
  source: "input/video.mp4"
  show_preview: false

pose:
  model: "rtmpose_m_halpe26"
  checkpoint: "https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-m_simcc-body7_pt-body7-halpe26_700e-256x192-4d3e73dd_20230605.zip"

  # RTMPose "384x288" e altura x largura.
  input_size:
    width: 192
    height: 256

  detector:
    model: "yolox_m"
    checkpoint: "https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/yolox_m_8xb8-300e_humanart-c2c7a14a.zip"
    input_size:
      width: 640
      height: 640

  runtime:
    backend: "onnxruntime"
    device: "cpu"

  confidence_thresholds:
    valid: 0.70
    uncertain: 0.40

  output:
    dir: "output/candidato_b_halpe26_m"
    landmarks_csv: "landmarks.csv"
    events_json: "events_ambiguous.json"
    run_info: "run_info.json"
    include_skeleton_video: true
    skeleton_video: "annotated.mp4"

  note: "Layout Halpe26 (26 keypoints). Landmarks do MVP (lado direito): right_shoulder=6, right_elbow=8, right_wrist=10, right_hip=12, right_knee=14, right_ankle=16, right_heel=25, right_toe=21 (dedao). Os equivalentes left_* tambem existem."

metrics:
  warmup_frames: 5