# Teste de desempenho: RTMPose-x em CPU via OpenVINO com a pose em INT8 (modelo inteiro)
# Gere o modelo antes com:
#   .venv-quant/Scripts/python.exe teste_desempenho/quantizar_int8.py --camadas todas --saida teste_desempenho/modelos/rtmpose-x_int8_total.xml
# Todas as configs deste diretório usam o mesmo vídeo, detector (YOLOX-x) e limiares.
# Só mudam o modelo de pose, o dispositivo e a pasta de saída.

input:
  source: "input/video.mp4"
  show_preview: false

pose:
  model: "rtmpose_x"
  note: "Pose em INT8 (modelo inteiro, NNCF); detector em FP32. FP16/BF16 não têm suporte nativo nesta CPU"
  checkpoint: "teste_desempenho/modelos/rtmpose-x_int8_total.xml"
  input_size:
    width: 288
    height: 384

  detector:
    model: "yolox_x"
    checkpoint: "https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/yolox_x_8xb8-300e_humanart-a39d44ed.zip"
    input_size:
      width: 640
      height: 640

  runtime:
    backend: "openvino"
    device: "cpu"

  confidence_thresholds:
    valid: 0.70
    uncertain: 0.40

  output:
    dir: "teste_desempenho/resultados/x_cpu_int8"
    landmarks_csv: "landmarks.csv"
    events_json: "events_ambiguous.json"
    run_info: "run_info.json"
    # Ligado por padrão: a escrita do vídeo entra no tempo de ponta a ponta (fps_pipeline), não na inferência
    include_skeleton_video: true
    skeleton_video: "skeleton.mp4"

metrics:
  warmup_frames: 5
